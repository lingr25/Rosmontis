name: Canary Smoke (Official Linux QQ)

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      install_vnc:
        description: 'Install optional VNC packages (0 = slim headless, 1 = with Fluxbox/x11vnc/noVNC)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      qq_deb_url:
        description: 'Optional official HTTPS Linux QQ .deb URL override (empty = auto-resolve latest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  canary-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CONTAINER_NAME: rosmontis-canary
      IMAGE_TAG: rosmontis:canary-smoke
      HTTP_PORT: '3000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build headless Linux QQ Docker image
        env:
          INSTALL_VNC: ${{ inputs.install_vnc || '0' }}
          QQ_DEB_URL: ${{ inputs.qq_deb_url || '' }}
        run: |
          set -euo pipefail
          docker build \
            -f docker/Dockerfile \
            --build-arg "INSTALL_VNC=${INSTALL_VNC}" \
            --build-arg "QQ_DEB_URL=${QQ_DEB_URL}" \
            -t "${IMAGE_TAG}" \
            .
          docker images "${IMAGE_TAG}"
          docker run --rm --entrypoint bash "${IMAGE_TAG}" -euo pipefail -c '
            for bin in Xvfb dbus-daemon ffmpeg node tini gosu; do
              command -v "${bin}" >/dev/null || { echo "Missing required binary: ${bin}" >&2; exit 1; }
            done
            if [ "$1" = "0" ]; then
              for vnc_bin in fluxbox x11vnc websockify; do
                if command -v "${vnc_bin}" >/dev/null 2>&1; then
                  echo "Unexpected VNC binary installed when INSTALL_VNC=0: ${vnc_bin}" >&2
                  exit 1
                fi
              done
              if [ -d /usr/share/novnc ]; then
                echo "Unexpected /usr/share/novnc directory when INSTALL_VNC=0" >&2
                exit 1
              fi
              echo "Verified slim headless image (INSTALL_VNC=0): VNC packages absent."
            fi
          ' _ "${INSTALL_VNC}"

      - name: Start headless canary container
        run: |
          set -euo pipefail
          CANARY_TOKEN="canary-$(openssl rand -hex 16)"
          echo "::add-mask::${CANARY_TOKEN}"
          printf 'CANARY_TOKEN=%s\n' "${CANARY_TOKEN}" >> "${GITHUB_ENV}"
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --shm-size=1g \
            --security-opt no-new-privileges:true \
            -p "127.0.0.1:${HTTP_PORT}:3000" \
            -e "ROSMONTIS_ACCESS_TOKEN=${CANARY_TOKEN}" \
            -e "ROSMONTIS_STATE_DIR=/app/data/state" \
            -e "ROSMONTIS_HTTP_PORT=3000" \
            "${IMAGE_TAG}"

      - name: Verify /health, /get_status, /get_login_qrcode & pure-JS invariants
        run: node scripts/canary_smoke.js

      - name: Dump sanitized container logs & cleanup
        if: always()
        run: |
          set +e
          if docker ps -a --format '{{.Names}}' | grep -Fxq "${CONTAINER_NAME}"; then
            echo "===== Container Logs (sanitized) ====="
            docker logs "${CONTAINER_NAME}" 2>&1 | node -e '
              const fs = require("fs");
              const token = process.env.CANARY_TOKEN || "";
              let input = fs.readFileSync(0, "utf8");
              if (token) {
                input = input.split(token).join("[REDACTED]");
              }
              process.stdout.write(input);
            '
            echo "===== Cleaning up ${CONTAINER_NAME} ====="
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          else
            echo "Container ${CONTAINER_NAME} was not created; nothing to clean up."
          fi
