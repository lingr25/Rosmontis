name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify zero runtime npm dependencies
        run: |
          node -e '
            const pkg = require("./package.json");
            if (pkg.dependencies && Object.keys(pkg.dependencies).length > 0) {
              throw new Error("Rosmontis must remain zero-runtime-dependency pure JS");
            }
          '
      - name: Check shell scripts syntax
        run: |
          bash -n scripts/install_bridge.sh
          bash -n scripts/entrypoint.sh
      - name: Validate workflow YAML & config JSON
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            JSON.parse(fs.readFileSync("config/rosmontis.example.json", "utf8"));
            JSON.parse(fs.readFileSync("jsconfig.json", "utf8"));
          '
          if python3 -c "import yaml" 2>/dev/null; then
            python3 -c 'import yaml, sys; [yaml.safe_load(open(f, encoding="utf-8")) for f in sys.argv[1:]]' \
              .github/workflows/ci.yml .github/workflows/canary.yml
          elif command -v ruby >/dev/null 2>&1; then
            ruby -ryaml -e 'ARGV.each { |f| YAML.load_file(f) }' \
              .github/workflows/ci.yml .github/workflows/canary.yml
          fi
      - name: Typecheck JSDoc (@ts-check modules)
        if: matrix.node-version == 22
        run: node scripts/typecheck.js --install
      - name: Run unit & protocol contract tests
        run: npm test
